[project]
name = "self-bi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "langchain>=1.0",
    "langchain-aws>=1.0",
    "boto3>=1.39", # >=1.39 reads AWS_BEARER_TOKEN_BEDROCK (Bedrock API key)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
